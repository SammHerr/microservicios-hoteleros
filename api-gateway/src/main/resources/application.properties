spring.application.name=api-gateway

server.port=${SERVER_PORT:8080}

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always

spring.cloud.gateway.server.webmvc.routes[0].id=hotel-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${HOTEL_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/hotels/**

spring.cloud.gateway.server.webmvc.routes[1].id=availability-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${AVAILABILITY_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/availability/**

spring.cloud.gateway.server.webmvc.routes[2].id=reservation-service
spring.cloud.gateway.server.webmvc.routes[2].uri=${RESERVATION_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/reservations/**

spring.cloud.gateway.server.webmvc.routes[3].id=payment-service
spring.cloud.gateway.server.webmvc.routes[3].uri=${PAYMENT_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/payments/**

spring.cloud.gateway.server.webmvc.routes[4].id=confirmation-service
spring.cloud.gateway.server.webmvc.routes[4].uri=${CONFIRMATION_SERVICE_URL:http://localhost:8085}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/confirmations/**

spring.cloud.gateway.server.webmvc.routes[5].id=calendar-service
spring.cloud.gateway.server.webmvc.routes[5].uri=${CALENDAR_SERVICE_URL:http://localhost:8086}
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/calendar/**